# Central Renovate runner for the infralicious org.
# This workflow lives in infralicious/renovate-config only.
# It opens PRs in target repos. It adds no file to them.
name: Renovate

on:
  schedule:
    # Run at 07:00 UTC each Monday.
    # That time is 02:00 CDT and 01:00 CST.
    # Both times fall before 3am in Chicago.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          # Owner without repositories scopes the token to all repos
          # in the owner's installation. Without it, the token covers
          # only this runner repo, and autodiscover finds no targets.
          owner: infralicious
          # Pin the token to the App permissions Renovate needs.
          # A permission not listed here is set to none.
          # A future App permission does not flow to this token
          # until this list is updated on purpose.
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Check out runner repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: renovate-config.js
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
