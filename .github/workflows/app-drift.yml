name: App Drift Check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run on business days, Monday to Friday at 09:00 UTC.
    # That time catches live UI drift, with no manifest change.
    - cron: "0 9 * * 1-5"
jobs:
  appDrift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check renovate App against its manifest
        run: >-
          python3 scripts/check-apps.py --mode jwt
          --manifest apps/infralicious-renovate.json
        env:
          APP_ID: ${{ secrets.RENOVATE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
